name: ingestion-pipeline-test
on: 
  push:
    branches: ["main"]
jobs:
  ingestion-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/${{ secrets.DB_NAME }}
      OLLAMA_URL: http://localhost:11434/api
      N8N_API_KEY: ${{ secrets.N8N_API_KEY}}
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: ${{secrets.DB_PASSWORD}}
          POSTGRES_DB: ${{secrets.DB_NAME}}
          POSTGRES_USER: ${{secrets.DB_USER}}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repo code
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      
      - name: alembic migration 
        run: alembic upgrade head 
        working-directory: backend/

      - name: run the app
        run: uvicorn main:app &
        working-directory: backend/

      - name: check health
        run: |
          START_TIME=$SECONDS  
          while true; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8000/health" || echo "000")
    
            if [ "$STATUS" -eq 200 ]; then
              echo "Web server responded with 200 OK!"
              break
            fi

            if (( SECONDS - START_TIME >= 60 )); then
                echo "Error: Timed out waiting for $URL (Last status: $STATUS)." >&2
                exit 1
            fi

            sleep 2
          done

      - name: run test
        run: pytest tests/
        working-directory: backend/

      - name: remove test article
        run: PGPASSWORD=${{secrets.DB_PASSWORD}} psql -U ${{secrets.DB_USER}} -d ${{secrets.DB_NAME}} -c "DELETE FROM articles WHERE title = 'test'; DELETE FROM clusters WHERE main_title = 'test'"
        if: always()
